version: 2

models:
  # ==========================================
  # 1. Form Pipeline Models
  # ==========================================
  - name: stg_pardot_visitor_activities
    description: "Bronze staging model for Pardot raw form activity submissions"
    columns:
      - name: activity_id
        tests:
          - not_null
          - unique

  - name: int_pardot_visitor_activities_cleaned
    description: "Silver intermediate model for cleaned form submissions with region tagging"
    columns:
      - name: activity_id
        tests:
          - not_null
          - unique

  # ==========================================
  # 2. Email Pipeline Models
  # ==========================================
  - name: stg_pardot_email_performance
    description: "Bronze staging model for Pardot raw email campaign performance metrics"
    columns:
      - name: email_performance_id
        tests:
          - not_null
          - unique
      - name: email_sent_date
        tests:
          - not_null

  - name: int_pardot_email_performance_cleaned
    description: "Silver intermediate model with calculated open, click, and bounce rates"
    columns:
      - name: email_performance_id
        tests:
          - not_null
          - unique
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ['EG Region', 'Other Region']